stages:
  - lint
  - build
  - deploy

lint:
  image:
    name: europe-north1-docker.pkg.dev/holi-shared/ghcr-io-remote/biomejs/biome:2.0.6
    entrypoint: [""]
  stage: lint
  script:
    - biome ci --reporter=gitlab --colors=off > /tmp/code-quality.json
    - cp /tmp/code-quality.json code-quality.json
  artifacts:
    paths:
      - code-quality.json
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_ID

build:docker:
  image: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:28
  stage: build
  services:
    - name: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:28-dind
      alias: docker
  variables:
    GCR_IMAGE: europe-north1-docker.pkg.dev/holi-shared/docker/holi-rewards
  script:
    - docker pull $GCR_IMAGE || true
    - docker build --cache-from=$GCR_IMAGE -t $GCR_IMAGE:latest -t $GCR_IMAGE:$CI_COMMIT_SHA -t $GCR_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push -a $GCR_IMAGE
  tags:
    - 4cpu-4gb

.deploy:
  stage: deploy
  image:
    name: europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.12.2
    entrypoint: ["/bin/sh", "-c"]
  needs:
    - "build:docker"
  artifacts:
    paths:
      - terraform
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    expire_in: 1 week
  script:
    - terraform/environments/scripts/create-or-update-env.sh "${CI_ENVIRONMENT_NAME}" "${CI_COMMIT_SHA}"
  resource_group: ${CI_ENVIRONMENT_NAME}
  interruptible: false
  allow_failure: false

deploy:staging:
  extends: .deploy
  environment:
    name: staging
    url: https://staging.rewards.apis.holi.social
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

deploy:staging:unified:
  needs: ["deploy:staging"]
  stage: deploy
  trigger:
    project: "app/holi-unified-api"
    branch: main
    forward:
      yaml_variables: false
      pipeline_variables: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

deploy:production:
  extends: .deploy
  environment:
    name: production
    url: https://rewards.apis.holi.social
  needs:
    - "deploy:staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy:production:unified:
  needs: ["deploy:production"]
  stage: deploy
  trigger:
    project: "app/holi-unified-api"
    branch: main
    forward:
      yaml_variables: false
      pipeline_variables: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success