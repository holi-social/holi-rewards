services:
  app:
    image: denoland/deno:2.5.2
    working_dir: /app
    env_file:
      - .env
    environment:
      FAKE: ${FAKE:-false}
    volumes:
      - ".:/app"
    command: /bin/sh -c "deno run db:migrate && echo && deno run serve:dev"
    ports:
      - "8015:8000"

  db:
    image: postgres:17.4
    environment:
      POSTGRES_USER: ${DB_USER:-rewards}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecret}
      POSTGRES_DB: ${DB_NAME:-rewards}
    volumes:
      - "db_data:/var/lib/postgresql/data"
    ports:
      - "5435:5432"

volumes:
  db_data:
